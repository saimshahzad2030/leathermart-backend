services:
  postgres:
    image: postgres:16-alpine
    container_name: leathermart-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: leathermart_dev
    ports:
      - "5432:5432"
    volumes:
      - leathermart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leathermart_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  leathermart_pgdata:
    driver: local
